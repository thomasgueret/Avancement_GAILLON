<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>Plan échafaudage MULTISECU+ 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : poste de travail plein écran — menu des éléments à gauche, planche à dessin au centre, propriétés et quantitatif à droite. */
:root{
  --bg:#E8ECEF; --panel:#FFFFFF; --panel-2:#F3F5F7; --ink:#16202A; --muted:#5A6774; --line:#D2D9E0;
  --accent:#D26A0C; --accent-ink:#FFFFFF; --accent-soft:#FBE6D2;
  --danger:#BE3A2F; --danger-soft:#F7DDDA; --ok:#2C7A4B; --warn:#C2560A;
  --paper:#FBFCFD; --grid:#E6EAEE; --grid-major:#CCD4DC;
  --c-bay:#E1E6EB; --c-deck:#F0E1B6; --c-deck-line:#C4AE74; --c-std:#1E2934; --c-gc:#2B8752;
  --c-wall:#6F7984; --c-wall-fill:#CDD2D8; --c-dim:#2F4C6B; --c-label:#16202A; --c-acc:#2A69AE;
  --c-amarr:#BE3A2F; --c-sel:#D26A0C; --c-net:#2F8A7A;
  --g3-bg:#E9EDF1; --g3-ground:#D5DAD3; --g3-grid1:#AEB6AE; --g3-grid2:#C4CBC4;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --radius:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --panel:#182029; --panel-2:#1F2832; --ink:#E4EAF0; --muted:#95A3B1; --line:#2C3743;
    --accent:#F08B2E; --accent-ink:#1B1105; --accent-soft:#3A2614;
    --danger:#E8695E; --danger-soft:#3A1E1B; --ok:#5EC08B; --warn:#F2A04E;
    --paper:#131A21; --grid:#1B232B; --grid-major:#28323C;
    --c-bay:#26303A; --c-deck:#463E2B; --c-deck-line:#7A6A43; --c-std:#D6DFE7; --c-gc:#5EC08B;
    --c-wall:#93A0AC; --c-wall-fill:#36404A; --c-dim:#9DC1E2; --c-label:#E4EAF0; --c-acc:#71AAE8;
    --c-amarr:#EF7B71; --c-sel:#F08B2E; --c-net:#62C6B3;
    --g3-bg:#141B22; --g3-ground:#232B27; --g3-grid1:#3B4640; --g3-grid2:#2D3631;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --panel:#182029; --panel-2:#1F2832; --ink:#E4EAF0; --muted:#95A3B1; --line:#2C3743;
  --accent:#F08B2E; --accent-ink:#1B1105; --accent-soft:#3A2614;
  --danger:#E8695E; --danger-soft:#3A1E1B; --ok:#5EC08B; --warn:#F2A04E;
  --paper:#131A21; --grid:#1B232B; --grid-major:#28323C;
  --c-bay:#26303A; --c-deck:#463E2B; --c-deck-line:#7A6A43; --c-std:#D6DFE7; --c-gc:#5EC08B;
  --c-wall:#93A0AC; --c-wall-fill:#36404A; --c-dim:#9DC1E2; --c-label:#E4EAF0; --c-acc:#71AAE8;
  --c-amarr:#EF7B71; --c-sel:#F08B2E; --c-net:#62C6B3;
  --g3-bg:#141B22; --g3-ground:#232B27; --g3-grid1:#3B4640; --g3-grid2:#2D3631;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Barre du haut ---------- */
.topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.mark{width:34px;height:34px;flex:none;color:var(--accent)}
.brand-t{display:grid;line-height:1.05}
.brand-k{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand-s{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.planname{display:flex;align-items:center;gap:8px;flex:1 1 240px;min-width:0}
#planName{flex:1;min-width:0;font-weight:600;font-size:15px;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:6px;text-overflow:ellipsis}
#planName:hover{border-color:var(--line)}
#planName:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel);color:var(--muted);white-space:nowrap;border:1px solid var(--line);max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.chip.ok{color:var(--ok)}
.chip.warn{color:var(--warn)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;flex:none}
.seg button{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:6px 16px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button svg{width:18px;height:18px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.danger{color:var(--danger)}
.btn.danger:hover:not(:disabled){border-color:var(--danger);background:var(--danger-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);border-color:var(--accent)}
.btn.block{width:100%;justify-content:center}
.ib{width:35px;height:35px;padding:0;justify-content:center}
.menu-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:40;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(10,20,30,.18);padding:12px;display:grid;gap:10px}
.pop-h{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.03em}
.pop-p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.pop-sep{height:1px;background:var(--line);margin:2px 0}
.pop-list{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:260px;overflow:auto}
.pop-item{display:flex;gap:6px;align-items:stretch}
.pop-item > button:first-child{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:7px 9px;cursor:pointer}
.pop-item > button:first-child:hover{border-color:var(--muted)}
.pop-item.cur > button:first-child{border-color:var(--accent);background:var(--accent-soft)}
.pop-item b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-item span{font-size:11.5px;color:var(--muted)}
.pop-row{display:flex;gap:6px;flex-wrap:wrap}
.pop-row .btn{flex:1 1 auto;justify-content:center}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px 9px;cursor:pointer;font-size:13.5px}
.menu-item:hover:not(:disabled){background:var(--panel-2)}
.menu-item:disabled{opacity:.45;cursor:not-allowed}
.menu-item svg{width:18px;height:18px;color:var(--muted);flex:none}
.menu-item small{display:block;color:var(--muted);font-size:11.5px}
.confirm{border:1px solid var(--danger);background:var(--danger-soft);border-radius:8px;padding:10px;display:grid;gap:8px;font-size:12.5px}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:13px}
.banner p{margin:0;flex:1 1 260px}

/* ---------- Plan de travail ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:252px minmax(0,1fr) 316px;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.drawer-h{display:none}
.stage{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper);min-height:0;min-width:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ov{position:absolute;z-index:3;display:flex;gap:6px;align-items:center}
.ov-top{top:8px;left:8px;right:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.ov-top > *{pointer-events:auto}
.ov-br{right:8px;bottom:8px}
.ov-bl{left:8px;bottom:36px;align-items:flex-end}
.hint{background:var(--ink);color:var(--panel);font-size:12.5px;line-height:1.35;padding:6px 12px;border-radius:14px;max-width:min(620px,100%);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.hint b{font-weight:600}
.toggles{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.tg{font-size:12px;font-weight:500;padding:4px 9px;border-radius:5px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tg[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tg-sel{font-size:12px;border:0;background:transparent;color:var(--muted);padding:3px 4px;border-left:1px solid var(--line);border-radius:0}
.zoom{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zoom button{width:34px;height:32px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.zoom button + button{border-left:1px solid var(--line)}
.zoom button:hover{background:var(--panel-2)}
.zoom svg{width:17px;height:17px}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:12px;max-width:230px}
.legend summary{cursor:pointer;padding:5px 10px;font-weight:600;color:var(--muted);list-style:none;font-size:12px;letter-spacing:.04em}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:"▸ ";}
.legend[open] summary::before{content:"▾ ";}
.legend ul{list-style:none;margin:0;padding:2px 10px 9px;display:grid;gap:4px}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:22px;height:10px;flex:none;display:inline-block}
.placebar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.placebar .btn{border-color:transparent}
.msg3d{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);z-index:2}
.only-narrow{display:none!important}

/* ---------- Menu des éléments ---------- */
.dft{padding:12px 12px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);display:grid;gap:7px}
.dft-h,.grp-h{font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dft-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center}
.dft-row label{font-size:12.5px;color:var(--muted)}
.dft-out{font-family:var(--font-mono);font-size:11.5px;color:var(--ink)}
.menu-scroll{overflow:auto;padding:4px 8px 14px;flex:1;min-height:0}
.grp{margin-top:12px;display:grid;gap:2px}
.grp-h{margin:0 6px 4px}
.tool{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;align-items:center;width:100%;text-align:left;padding:6px 8px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:500;line-height:1.2}
.tool svg{width:30px;height:23px;color:var(--muted)}
.tool small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.tool:hover{background:var(--panel-2)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tool[aria-pressed="true"] svg{color:var(--accent)}
.grp-note{font-size:11.5px;color:var(--muted);margin:2px 8px 2px 47px;line-height:1.35}
.src{font-size:11px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line);line-height:1.4}

/* ---------- Panneau de droite ---------- */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px 9px;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:14px 14px 18px;flex:1;min-height:0}
.ph{display:grid;gap:3px;margin-bottom:4px}
.ph-k{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ph-t{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.ph-s{color:var(--muted);font-size:12.5px;line-height:1.4}
.fs{border-top:1px solid var(--line);padding-top:11px;margin-top:12px;display:grid;gap:8px}
.fs h4{margin:0;font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:8px}
.row > label{font-size:12.5px;color:var(--muted)}
.ctl{width:100%;min-width:0;font-size:13px;font-weight:500;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 7px;height:31px}
textarea.ctl{height:auto;min-height:74px;resize:vertical;line-height:1.4}
.ctl:focus{outline:none;border-color:var(--accent)}
.ctl:disabled{opacity:.6}
.ro{font-family:var(--font-mono);font-size:12.5px}
.help{font-size:11.5px;color:var(--muted);line-height:1.4;margin:0}
.stepper{display:grid;grid-template-columns:31px minmax(0,1fr) 31px}
.stepper button{border:1px solid var(--line);background:var(--panel-2);cursor:pointer;height:31px;font-size:16px;line-height:1}
.stepper button:first-child{border-radius:5px 0 0 5px}
.stepper button:last-child{border-radius:0 5px 5px 0}
.stepper input{border-radius:0;border-left:0;border-right:0;text-align:center;font-family:var(--font-mono)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.cb{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.cb:hover{border-color:var(--muted)}
.cb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cb .x{color:var(--muted);font-size:14px;line-height:1;margin-left:2px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto;justify-content:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--panel-2);border-radius:7px;padding:9px 10px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.vig{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.vig button{width:100%;text-align:left;display:grid;grid-template-columns:8px minmax(0,1fr);gap:9px;align-items:start;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;cursor:pointer;font-size:12.5px;line-height:1.4}
.vig button:hover{border-color:var(--muted)}
.vig i{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--muted)}
.vig .w i{background:var(--warn)}
.steps{margin:0;padding-left:18px;display:grid;gap:5px;font-size:12.5px;color:var(--ink);line-height:1.45}
.steps li::marker{color:var(--accent);font-weight:600}
.bom{width:100%;border-collapse:collapse;font-size:12.5px}
.bom th{text-align:left;font-family:var(--font-display);font-weight:600;letter-spacing:.09em;text-transform:uppercase;font-size:12px;color:var(--accent);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.bom td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.bom td.q{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.note-box{margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.45;background:var(--panel-2);border-radius:7px;padding:9px 10px}
.pf{display:grid;gap:6px;margin-top:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--panel);border-radius:10px;padding:9px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.38);z-index:25}

@media (max-width:1100px){ .work{grid-template-columns:232px minmax(0,1fr) 288px} }
@media (max-width:980px){
  .work{grid-template-columns:minmax(0,1fr)}
  .only-narrow{display:inline-flex!important}
  .drawer{position:fixed;top:0;bottom:0;z-index:30;width:min(330px,88vw);border-radius:0;transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .drawer.left{left:0;transform:translateX(-104%);padding-left:env(safe-area-inset-left,0px)}
  .drawer.right{right:0;transform:translateX(104%);padding-right:env(safe-area-inset-right,0px)}
  .drawer.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .drawer-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.04em}
  .ov-bl{bottom:38px}
}
@media (max-width:640px){
  .btn .lbl,.seg .full,.brand-t{display:none}
  .mark{width:28px;height:28px}
  .planname{flex:1 1 calc(100% - 46px)}
  .chip{max-width:44%}
  .actions{gap:5px}
  #planName{font-size:14px;padding:5px 6px}
  .seg button{padding:6px 10px;font-size:14px;gap:5px}
  .topbar{gap:8px}
  .app{gap:8px;padding-block:8px}
  .hint{font-size:12px;padding:5px 10px}
  .legend:not([open]){max-width:120px}
}
@media (prefers-reduced-motion: reduce){ .drawer{transition:none} }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">

function bayFrame(b){ const c = Math.cos(rad(b.a)), s = Math.sin(rad(b.a)); return { ox:b.x, oy:b.y, ux:c, uy:s, vx:-s*b.s, vy:c*b.s }; }

const Cloud = { inViewer: !!(window.claude && typeof window.claude.use === 'function'), db:null, user:null, dl:null, canWrite:null, list:[], loaded:false };

async function initCloud(){
  if (!Cloud.inViewer){ renderPlansPop(); renderExportPop(); updateStatus(); return; }
  const safe = p => Promise.resolve(p).then(x => x, () => null);
  const [db, user, dl] = await Promise.all([safe(window.claude.use('db')), safe(window.claude.use('user')), safe(window.claude.use('downloads'))]);
  Cloud.db = db; Cloud.user = user; Cloud.dl = dl;
  if (user && user.can){ try { Cloud.canWrite = await user.can('data.write'); } catch (err) { Cloud.canWrite = null; } }
  if (db){ try { db.collection('plans').onSnapshot(onPlansSnap, () => { Cloud.db = null; renderPlansPop(); updateStatus(); }); } catch (err) { Cloud.db = null; } }
  renderPlansPop(); renderExportPop(); updateStatus(); renderPanels();
}
function onPlansSnap(snap){
  Cloud.list = snap.docs.filter(d => d.exists).map(d => { const x = d.data() || {}; return { id:d.id, name:str(x.name, 120) || 'Plan sans nom', updatedAt:str(x.updatedAt, 40), rev:str(x.rev, 40), nBays:Array.isArray(x.elements) ? x.elements.filter(e => e && e.t==='bay').length : 0, data:x }; })
    .sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''));
  const definitive = !snap.metadata.fromCache, first = !Cloud.loaded && definitive; if (definitive) Cloud.loaded = true;
  const cur = S.plan.id ? Cloud.list.find(p => p.id === S.plan.id) : null;
  if (S.plan.id && !cur && definitive && !snap.metadata.hasPendingWrites){ S.plan.id = null; S.plan.rev = null; S.dirty = true; scheduleDraft(); toast('Ce plan n’est plus dans l’espace partagé. Votre copie est conservée ; enregistrez-la pour la partager à nouveau.'); }
  else if (cur && cur.rev && cur.rev !== S.plan.rev && !snap.metadata.hasPendingWrites){
    if (!S.dirty){ loadElements({ id:cur.id, name:cur.name, rev:cur.rev, updatedAt:cur.updatedAt }, sanitize(cur.data.elements)); toast('Plan mis à jour par un autre intervenant.'); }
    else showBanner(cur);
  }
  if (first && (!bootFromDraft || (S.plan.example && !S.dirty)) && !S.plan.id && Cloud.list.length){ const p = Cloud.list[0]; loadElements({ id:p.id, name:p.name, rev:p.rev, updatedAt:p.updatedAt }, sanitize(p.data.elements)); toast('Plan partagé « ' + p.name + ' » ouvert.'); }
  renderPlansPop(); updateStatus();
}

  const b = $('#banner'); b.innerHTML = ''; b.hidden = false;
  b.append(h('p', { text:'Une version plus récente de « ' + cur.name + ' » a été enregistrée par un autre intervenant (' + timeStr(cur.updatedAt) + ').' }),
    h('button', { class:'btn primary', type:'button', text:'Charger cette version', onclick:() => { loadElements({ id:cur.id, name:cur.name, rev:cur.rev, updatedAt:cur.updatedAt }, sanitize(cur.data.elements)); } }),
    h('button', { class:'btn', type:'button', text:'Garder la mienne', onclick:hideBanner }));

async function savePlan(asNew){
  if (!Cloud.db){ toast('Enregistrement partagé indisponible ici. Utilisez Exporter › Fichier projet.'); return; }
  const id = (!asNew && S.plan.id) || ('p' + Date.now().toString(36) + uid().slice(0,4));
  const name = (S.plan.name || '').trim() || 'Plan sans nom', rev = uid(), body = { name, updatedAt:new Date().toISOString(), rev, schema:1, elements:S.plan.elements };
  if (JSON.stringify(body).length > 250000){ toast('Plan trop volumineux pour l’espace partagé : exportez-le en fichier projet.'); return; }
  const prev = { id:S.plan.id, rev:S.plan.rev };
  S.plan.id = id; S.plan.rev = rev;
  try {
    await Cloud.db.collection('plans').doc(id).set(body);
    S.plan.name = name; S.plan.updatedAt = body.updatedAt; S.plan.example = false; S.dirty = false; $('#planName').value = name;
    scheduleDraft(); updateStatus(); hideBanner(); closePops(); toast('Plan « ' + name + ' » enregistré pour tous les intervenants.');

async function deleteShared(p){
  try { await Cloud.db.collection('plans').doc(p.id).delete(); if (S.plan.id===p.id){ S.plan.id = null; S.plan.rev = null; S.dirty = true; scheduleDraft(); updateStatus(); } toast('Plan « ' + p.name + ' » supprimé de l’espace partagé.'); }
  catch (err) { toast(err && err.code==='invalid_argument' ? 'Suppression refusée : accès en lecture seule.' : 'Suppression impossible pour le moment.'); }
}
function updateStatus(){
  const el = $('#status'); let t, cls = '';
  if (S.plan.example && !S.plan.id){ t = S.dirty ? 'Exemple modifié, non enregistré' : 'Exemple, non enregistré'; cls = 'warn'; }
  else if (!Cloud.db){ t = 'Conservé dans ce navigateur'; }
  else if (!S.plan.id){ t = 'Non partagé'; cls = 'warn'; }
  else if (S.dirty){ t = 'Modifications non enregistrées'; cls = 'warn'; }
  else { t = 'Enregistré · ' + timeStr(S.plan.updatedAt); cls = 'ok'; }
  el.textContent = t; el.className = 'chip ' + cls; el.title = t;
}

  container.querySelectorAll('.confirm').forEach(x => x.remove()); container.append(box); box.querySelector('button').focus();
}

}
function renderExportPop(){
  const pop = $('#popExport'); pop.innerHTML = ''; const off = Cloud.inViewer && !Cloud.dl;
  pop.append(h('div', { class:'pop-h', text:'Exporter' }));

function fileBase(){ return ((S.plan.name || 'plan-echafaudage').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 60)) || 'plan-echafaudage'; }
async function offerFile(filename, data){
  if (Cloud.dl){
    try { await Cloud.dl.save({ filename, data }); toast('Fichier « ' + filename + ' » enregistré.'); }
    catch (err) { const c = err && err.code; if (c==='declined') return; toast(c==='rate_limited' ? 'Un enregistrement est déjà en attente : réessayez dans un instant.' : 'Le fichier n’a pas pu être enregistré.'); }
    return;
  }
  if (Cloud.inViewer){ toast('Le téléchargement n’est pas disponible dans cette vue.'); return; }
  const blob = data instanceof Blob ? data : new Blob([data], { type:'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportJSON(){ offerFile(fileBase() + '.json', JSON.stringify({ format:'multisecu2-plan', version:1, name:S.plan.name, exportedAt:new Date().toISOString(), elements:S.plan.elements }, null, 1)); }
function exportCSV(){
  const rows = computeBOM(), esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  const lines = ['Catégorie;Désignation;Quantité;Unité'].concat(rows.map(r => [esc(r.grp), esc(r.des), r.unit==='m²' ? fmt(r.q, 1) : Math.round(r.q), r.unit].join(';')));
  offerFile(fileBase() + '-quantitatif.csv', '﻿' + lines.join('\r\n'));
}
async function exportPNG(){
  const bb = planBBox(), m = 1.2, wM = bb.x1-bb.x0+2*m, hM = bb.y1-bb.y0+2*m, k = clamp(Math.min(2600/wM, 1700/hM), 8, 110);
  const Wp = Math.round(wM*k), Hp = Math.round(hM*k), band = 170, W2 = Math.max(Wp, 1400);
  const c = document.createElement('canvas'); c.width = W2; c.height = Hp + band; const g = c.getContext('2d');
  const P = lightPalette(), saved = VW, savedHover = S.hover; S.hover = null;
  VW = { k, tx:(W2-Wp)/2 + (m-bb.x0)*k, ty:(m-bb.y0)*k };
  try { drawPlan(g, W2, Hp, P, { interactive:false }); } finally { VW = saved; S.hover = savedHover; }
  cartouche(g, P, Hp, W2, band, k);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  if (blob) offerFile(fileBase() + '-plan.png', blob);
}
function cartouche(g, P, y, W, hh, k){
  g.fillStyle = P.panel; g.fillRect(0, y, W, hh); g.fillStyle = P.ink; g.fillRect(0, y, W, 3);
  const sm = summary(), x0 = 28;
  g.fillStyle = P.sel; g.font = '600 15px "Barlow Condensed","Arial Narrow",sans-serif'; g.fillText('PLAN D’ÉCHAFAUDAGE · MULTISECU+ 2', x0, y+32);
  g.fillStyle = P.ink; g.font = '700 30px "Barlow Condensed","Arial Narrow",sans-serif'; g.fillText((S.plan.name || 'Plan sans nom').slice(0, 70), x0, y+66);
  g.font = '500 15px "Barlow",system-ui,sans-serif'; g.fillStyle = P.muted;
  g.fillText(new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' }) + ' · cotes en mètres', x0, y+92);
  g.fillText(plural(sm.n, 'travée') + ' · ' + fmt(sm.lin) + ' m de travées · plancher haut ' + fmt(sm.top) + ' m · ' + fmt(sm.sp, 1) + ' m² de plancher · ' + plural(sm.amarr, 'point') + ' d’amarrage', x0, y+116);
  g.font = '500 12.5px "Barlow",system-ui,sans-serif';
  g.fillText('Document de travail indicatif, à valider par le responsable du montage selon la notice du fabricant (réf. 111146) et la note de calcul.', x0, y+146);
  const L = [0.5,1,2,5,10].find(v => v*k >= 90) || 10, sx = W - 28 - L*k*2, sy = y + 40;
  g.fillStyle = P.ink; g.strokeStyle = P.ink; g.lineWidth = 1; g.fillRect(sx, sy, L*k, 6); g.strokeRect(sx+.5, sy+.5, L*k*2, 6);
  g.font = '500 12px "IBM Plex Mono",monospace'; g.fillText('0', sx-4, sy+22); g.fillText(fmt(L, L<1?2:0), sx + L*k - 8, sy+22); g.fillText(fmt(2*L, L<1?2:0) + ' m', sx + 2*L*k - 18, sy+22);
  const leg = [[P.deck,'Travée planchéiée','fill'],[P.gc,'Garde-corps + plinthe','line'],[P.acc,'Diagonale / trappe','line'],[P.amarr,'Amarrage','line'],[P.net,'Filet / bâche','dash']];
  const lx = Math.max(760, W - 28 - 3*210), ly = y + 88;
  leg.forEach(([col, t, kind], i) => { const xx = lx + (i%3)*210, yy = ly + Math.floor(i/3)*26; if (xx + 190 > W) return;
    if (kind==='fill'){ g.fillStyle = col; g.fillRect(xx, yy-8, 26, 12); g.strokeStyle = P.std; g.strokeRect(xx+.5, yy-7.5, 26, 12); }
    else { g.strokeStyle = col; g.lineWidth = 4; if (kind==='dash') g.setLineDash([6,4]); g.beginPath(); g.moveTo(xx, yy-2); g.lineTo(xx+26, yy-2); g.stroke(); g.setLineDash([]); g.lineWidth = 1; }
    g.fillStyle = P.ink; g.font = '500 13px "Barlow",system-ui,sans-serif'; g.fillText(t, xx+34, yy+2); });
}
function export3D(){
  if (S.view !== '3d') setView('3d');
  if (!T3.ready){ toast('La vue 3D n’est pas disponible.'); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => { c3.toBlob(b => { if (b) offerFile(fileBase() + '-3d.png', b); }, 'image/png'); }));
}
$('#fileIn').addEventListener('change', () => {
  const f = $('#fileIn').files && $('#fileIn').files[0]; if (!f) return;
  if (f.size > 5e6){ toast('Fichier trop volumineux.'); return; }
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(String(rd.result)); const list = sanitize(Array.isArray(d) ? d : d.elements); if (!list.length){ toast('Ce fichier ne contient aucun élément de plan.'); return; }
    loadElements({ name:str(d.name, 120) || f.name.replace(/\.json$/i, '') }, list); S.dirty = true; updateStatus(); closePops(); toast('Plan importé : ' + plural(list.length, 'élément') + '.'); }
    catch (err) { toast('Fichier illisible : choisissez un fichier projet .json exporté depuis cet outil.'); } };
  rd.readAsText(f);
});

let toastT = null;
function toast(msg, o={}){
  const el = $('#toast'); el.innerHTML = ''; el.append(h('span', { text:msg }));
  if (o.action) el.append(h('button', { type:'button', text:o.action, onclick:() => { el.hidden = true; o.fn(); } }));
  el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, o.ms || 4200);
}
const isNarrow = () => window.matchMedia('(max-width:980px)').matches;
function openDrawer(id){ closeDrawers(); $('#' + id).classList.add('open'); $('#scrim').hidden = false; }
function closeDrawers(){ $('#menu').classList.remove('open'); $('#side').classList.remove('open'); $('#scrim').hidden = true; }

function initDefaults(){
  const fill = (sel, vals, cur) => { const s = $(sel); s.innerHTML = ''; vals.forEach(v => s.append(h('option', { value:String(v), text:fmt(v) + ' m' }))); s.value = String(cur); };
  fill('#dH0', CAT.h0, S.defaults.h0); fill('#dDh', CAT.hNiveau, S.defaults.dh);
  $('#dN').value = S.defaults.n; $('#dDecks').value = S.defaults.decks;
  const upd = () => { const top = S.defaults.h0 + (S.defaults.n-1)*S.defaults.dh; $('#dOut').textContent = 'Plancher haut ' + fmt(top) + ' m · poteaux ' + fmt(top + CAT.hGC) + ' m'; scheduleDraft(); if (S.tool==='bay' && S.cursor){ S.ghost = ghostBay(S.cursor); requestRender(); } };
  const setN = v => { S.defaults.n = clamp(Math.round(v) || 1, 1, 30); $('#dN').value = S.defaults.n; upd(); };
  $('#dN').addEventListener('change', () => setN(parseFloat($('#dN').value)));
  $('#dNm').addEventListener('click', () => setN(S.defaults.n - 1)); $('#dNp').addEventListener('click', () => setN(S.defaults.n + 1));
  $('#dH0').addEventListener('change', () => { S.defaults.h0 = parseFloat($('#dH0').value); upd(); });
  $('#dDh').addEventListener('change', () => { S.defaults.dh = parseFloat($('#dDh').value); upd(); });
  $('#dDecks').addEventListener('change', () => { S.defaults.decks = $('#dDecks').value; upd(); });
  upd();
}

  $('#pbRot').addEventListener('click', rotateAction); $('#pbFlip').addEventListener('click', flipAction); $('#pbDone').addEventListener('click', () => { S.op = null; setTool('select'); });
  $('#tabProps').addEventListener('click', () => setTab('props')); $('#tabBom').addEventListener('click', () => setTab('bom'));

  if (window.ResizeObserver) new ResizeObserver(resizeStage).observe(stage); else window.addEventListener('resize', resizeStage);

  const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', themeChanged);

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { requestRender(); if (T3.ready && S.view==='3d'){ build3D(); req3D(); } });
}
function syncToggles(){ document.querySelectorAll('.tg[data-show]').forEach(b => b.setAttribute('aria-pressed', String(!!S.show[b.dataset.show]))); $('#snapSel').value = String(S.snap); }
